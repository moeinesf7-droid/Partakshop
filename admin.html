<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت پارتاک</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff8fb;color:#292229;font-family:Tahoma,Arial,sans-serif}main{width:min(900px,100%);margin:auto;padding:20px 12px 50px}h1{margin:5px 0;font-size:26px}h2{margin:0 0 18px}.muted{color:#777;font-size:13px}.box,.stat{background:#fff;border:1px solid #eee;border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 4px 18px #00000008}.login{display:flex;gap:10px}.login input{flex:1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{margin:0}.stat b{display:block;font-size:25px;margin-top:7px}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.full{grid-column:1/-1}input,select,button{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;font:inherit}button{background:#241d24;color:#fff;border:0;cursor:pointer}.price{display:flex;direction:ltr}.price input{border-radius:12px 0 0 12px}.toman{display:flex;align-items:center;padding:0 14px;background:#f2ebef;border:1px solid #ddd;border-right:0;border-radius:0 12px 12px 0;white-space:nowrap}.actions{display:flex;gap:10px}.actions button{flex:1}.cancel{background:#777}.msg{display:none;margin-top:12px;padding:10px;border-radius:12px;background:#e8f8ed}.product,.order{padding:14px;border:1px solid #eee;border-radius:16px;margin:10px 0}.prow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.ptitle{font-weight:bold;font-size:17px}.meta{color:#777;font-size:13px;line-height:1.9}.pbuttons{display:flex;gap:7px;flex-shrink:0}.delete{background:#a94d70}@media(max-width:650px){.stats,.form{grid-template-columns:1fr}.full{grid-column:auto}.login{display:grid;grid-template-columns:1fr}.prow{flex-direction:column}.pbuttons{width:100%}.pbuttons button{flex:1}}
</style></head><body><main><h1>پنل مدیریت پارتاک</h1><p class="muted">مدیریت محصولات و سفارش‌ها</p><section class="box"><h2>ورود مدیر</h2><div class="login"><input id="adminKey" type="password" placeholder="کلید مدیر"><button id="loginBtn" type="button">ورود</button></div><div id="loginMsg" class="msg"></div></section><section id="panel" hidden><div class="stats"><div class="stat">محصولات<b id="items">۰</b></div><div class="stat">سفارش‌ها<b id="ordersCount">۰</b></div><div class="stat">فروش<b id="sales">۰ تومان</b></div></div><section class="box"><h2 id="formTitle">افزودن محصول</h2><form id="form" class="form"><div class="field"><label>نام محصول</label><input id="name" required placeholder="مثلاً عطر زنانه پارتاک"></div><div class="field"><label>دسته‌بندی</label><input id="cat" required placeholder="مثلاً عطر و ادکلن"></div><div class="field full"><label>قیمت</label><div class="price"><input id="price" required type="number" min="1" inputmode="numeric" placeholder="مثلاً ۵۹۰۰۰۰"><span class="toman">تومان</span></div></div><div class="field full"><label>ایموجی <span class="muted">(اختیاری)</span></label><input id="icon" placeholder="مثلاً 💄 یا 🧴"></div><div class="actions full"><button id="submitBtn" type="submit">افزودن محصول</button><button id="cancelBtn" class="cancel" type="button" hidden>لغو ویرایش</button></div></form><div id="formMsg" class="msg"></div></section><section class="box"><h2>محصولات</h2><div id="products">در حال دریافت...</div></section><section class="box"><h2>آخرین سفارش‌ها</h2><div id="orders">در حال دریافت...</div></section></section></main><script>
let key="",editingId=null,data={products:[],orders:[]};const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString("fa-IR")+" تومان";function msg(el,t,ok=false){el.textContent=t;el.style.display="block";el.style.background=ok?"#e8f8ed":"#fff0f2"}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}async function api(url,opt={}){opt.headers=Object.assign({},opt.headers||{}, {"x-admin-key":key});let r=await fetch(url,Object.assign({},opt,{cache:"no-store"})),d={};try{d=await r.json()}catch(e){}if(!r.ok)throw Error(d.error||("خطای سرور "+r.status));return d}async function load(){data=await api("/api/admin");render()}async function login(){key=$("adminKey").value.trim();if(!key)return msg($("loginMsg"),"کلید مدیر را وارد کنید");try{await load();$("panel").hidden=false;msg($("loginMsg"),"ورود موفق بود ✅",true);sessionStorage.setItem("partak_admin_key",key)}catch(e){key="";msg($("loginMsg"),e.message||"کلید مدیر نادرست است")}}function render(){let ps=data.products||[],os=data.orders||[];$("items").textContent=ps.length.toLocaleString("fa-IR");$("ordersCount").textContent=os.length.toLocaleString("fa-IR");$("sales").textContent=money(os.filter(o=>o.status!=="لغو شد").reduce((a,o)=>a+Number(o.total||0),0));$("products").innerHTML=ps.length?ps.map(p=>`<div class="product"><div class="prow"><div><div class="ptitle">${esc(p.icon||"🛍️")} ${esc(p.name)}</div><div class="meta">دسته‌بندی: ${esc(p.cat)}<br>قیمت: <b>${money(p.price)}</b></div></div><div class="pbuttons"><button type="button" onclick="editProduct(${p.id})">ویرایش</button><button class="delete" type="button" onclick="deleteProduct(${p.id})">حذف</button></div></div></div>`).join(""):"<p class='muted'>محصولی ثبت نشده است.</p>";$("orders").innerHTML=os.length?os.map(o=>`<div class="order"><b>${esc(o.code)}</b> — ${esc(o.name)}<br><span class="muted">${esc(o.phone)} • ${money(o.total)}<br>${esc(o.address)}</span><br><select onchange="changeStatus('${esc(o.code)}',this.value)"><option ${o.status==="در انتظار بررسی"?"selected":""}>در انتظار بررسی</option><option ${o.status==="در حال آماده‌سازی"?"selected":""}>در حال آماده‌سازی</option><option ${o.status==="ارسال شد"?"selected":""}>ارسال شد</option><option ${o.status==="تحویل شد"?"selected":""}>تحویل شد</option><option ${o.status==="لغو شد"?"selected":""}>لغو شد</option><option ${o.status==="در انتظار پرداخت آنلاین"?"selected":""}>در انتظار پرداخت آنلاین</option></select></div>`).join(""):"<p class='muted'>سفارشی ثبت نشده است.</p>"}function editProduct(id){let p=(data.products||[]).find(x=>Number(x.id)===Number(id));if(!p)return;editingId=Number(id);$("name").value=p.name||"";$("cat").value=p.cat||"";$("price").value=p.price||"";$("icon").value=p.icon||"";$("formTitle").textContent="ویرایش محصول";$("submitBtn").textContent="ذخیره تغییرات";$("cancelBtn").hidden=false;window.scrollTo({top:0,behavior:"smooth"})}function cancelEdit(){editingId=null;$("form").reset();$("formTitle").textContent="افزودن محصول";$("submitBtn").textContent="افزودن محصول";$("cancelBtn").hidden=true;$("formMsg").style.display="none"}$("form").onsubmit=async e=>{e.preventDefault();let payload={name:$("name").value.trim(),cat:$("cat").value.trim(),price:Number($("price").value),icon:$("icon").value.trim(),old_price:null};if(!payload.name||!payload.cat||!Number.isFinite(payload.price)||payload.price<=0)return msg($("formMsg"),"اطلاعات محصول را درست وارد کنید");$("submitBtn").disabled=true;try{if(editingId!==null){await api("/api/products?id="+editingId,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});cancelEdit();msg($("formMsg"),"محصول با موفقیت ویرایش شد ✅",true)}else{await api("/api/products",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});$("form").reset();msg($("formMsg"),"محصول با موفقیت اضافه شد ✅",true)}await load();$("panel").hidden=false}catch(e){msg($("formMsg"),e.message||"عملیات انجام نشد")}finally{$("submitBtn").disabled=false}};async function deleteProduct(id){if(!confirm("این محصول حذف شود؟"))return;try{await api("/api/products?id="+id,{method:"DELETE"});await load()}catch(e){alert(e.message)}}async function changeStatus(code,status){try{await api("/api/orders",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({code,status})});await load()}catch(e){alert(e.message)}}$("loginBtn").onclick=login;$("adminKey").onkeydown=e=>{if(e.key==="Enter")login()};$("cancelBtn").onclick=cancelEdit;let saved=sessionStorage.getItem("partak_admin_key");if(saved){key=saved;$("adminKey").value=saved;load().then(()=>$("panel").hidden=false).catch(()=>{sessionStorage.removeItem("partak_admin_key");key=""})}
</script></body></html>
