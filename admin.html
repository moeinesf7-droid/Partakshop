<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل مدیریت پارتاک</title>
<link rel="stylesheet" href="admin.css">
</head>

<body>

<main class="wrap">

<h1>پنل مدیریت پارتاک</h1>

<p>پس از استقرار روی سرور، این پنل به دیتابیس آنلاین متصل می‌شود.</p>

<section class="box">

<h2>ورود مدیر</h2>

<input id="adminKey" type="password" placeholder="کلید مدیر">

<button onclick="login()">ورود</button>

<span id="loginMsg"></span>

</section>

<section id="panel" hidden>

<div class="stats">

<div>
محصولات
<b id="items">۰</b>
</div>

<div>
سفارش‌ها
<b id="ordersCount">۰</b>
</div>

<div>
فروش
<b id="sales">۰</b>
تومان
</div>

</div>

<section class="box">

<h2>افزودن محصول</h2>

<form id="form">

<label>نام محصول</label>
<input id="name" required placeholder="نام محصول">

<label>دسته‌بندی</label>
<input id="cat" required placeholder="دسته‌بندی">

<label>قیمت قبلی</label>
<input id="old_price" type="number" placeholder="قیمت قبلی (اختیاری)">

<label>قیمت جدید</label>
<input id="price" type="number" placeholder="مثلاً 590000">

<label>ایموجی (اختیاری)</label>
<input id="icon" placeholder="ایموجی">

<button type="submit">افزودن</button>

</form>

</section>

<section class="box">

<h2>محصولات</h2>

<div id="products"></div>

</section>

<section class="box">

<h2>آخرین سفارش‌ها</h2>

<div id="orders"></div>

</section>

</section>

</main>

<script src="admin.js?v=4"></script>

</body>
</html>
